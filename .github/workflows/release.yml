name: Release

# Publishes to npm when a version tag (v0.1.1 and so on) is pushed. npm trusts this
# workflow (trusted publishing), so no npm token is stored anywhere, and each version
# gets a provenance statement linking it to this repository and commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

# Third-party actions are pinned to commit SHAs; the comment names the release.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check that the tag matches the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match package.json ($version)"
            exit 1
          fi
      - run: npm publish
