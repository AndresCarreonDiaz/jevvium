name: Release

# Versions are published to npm by hand, by the maintainer, with npm's two-factor check:
# nothing in this repository can publish. The package is built from a clean clone of the
# pushed commit (scripts/pack-release.sh), and the build is reproducible, so when the
# version tag (v0.2.0 and so on) is pushed after publishing, this checks the release in
# the open: the checks pass, the tag matches package.json, and the package on npm is byte
# for byte what this commit builds.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs; the comment names the release.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check that the tag matches the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match package.json ($version)"
            exit 1
          fi
      - name: Check that the package on npm is what this commit builds
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! npm view "jevvium@$version" version > /dev/null 2>&1; then
            echo "jevvium@$version is not on npm yet: publish it, then re-run this job."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/built" "$RUNNER_TEMP/published"
          npm pack --pack-destination "$RUNNER_TEMP/built"
          npm pack "jevvium@$version" --pack-destination "$RUNNER_TEMP/published"
          built="$RUNNER_TEMP/built/jevvium-$version.tgz"
          published="$RUNNER_TEMP/published/jevvium-$version.tgz"
          sha256sum "$built" "$published"
          tar -xzf "$built" -C "$RUNNER_TEMP/built"
          tar -xzf "$published" -C "$RUNNER_TEMP/published"
          # The files are what matters; the tarballs themselves have matched byte for byte too.
          diff -r "$RUNNER_TEMP/built/package" "$RUNNER_TEMP/published/package"
          if cmp -s "$built" "$published"; then
            echo "jevvium@$version on npm is byte for byte what $GITHUB_REF_NAME builds."
          else
            echo "jevvium@$version on npm has the same files as $GITHUB_REF_NAME builds, in a tarball packed differently."
          fi
